name: Build Windows exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}   # lets you manually trigger a build from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller pdf2md.spec

      - name: Zip the build output
        run: Compress-Archive -Path dist\PDF2Markdown\* -DestinationPath PDF2Markdown-windows.zip
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF2Markdown-windows
          path: PDF2Markdown-windows.zip
          retention-days: 30
